<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeleneč Home</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --border: #262a36;
      --text: #e6e8ef;
      --muted: #8b92a5;
      --accent: #7aa2f7;
      --green: #9ece6a;
      --red: #f7768e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem;
    }
    h2 {
      margin: 0 0 1rem 0;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-small {
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 0.72rem;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-small:hover { color: #fff; border-color: var(--accent); }

    .weather-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .weather-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem;
    }
    .weather-city { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
    .weather-temp { font-size: 1.65rem; font-weight: 700; }
    .weather-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }

    .train-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
    }
    .train-row:last-child { border-bottom: none; }
    .train-time { font-weight: 700; font-size: 1.05rem; color: #fff; min-width: 52px; }
    .train-info { flex: 1; padding: 0 0.75rem; }
    .train-dest { font-weight: 500; font-size: 0.95rem; }
    .train-num { font-size: 0.78rem; color: var(--muted); }
    .badge-ok { color: var(--green); font-size: 0.8rem; font-weight: 600; }
    .badge-delay { color: var(--red); font-size: 0.8rem; font-weight: 700; }

    .news-item {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }
    .news-item:last-child { border-bottom: none; }
    .news-item a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.35;
      display: block;
    }
    .news-item a:hover { color: var(--accent); }
    .news-meta { font-size: 0.75rem; color: var(--accent); margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <div class="grid">
    <!-- Column 1: Trains -->
    <div class="card">
      <h2>
        <span>🚆 Zeleneč Departures</span>
        <span>
          <a class="btn-small" href="https://spravazeleznic.cz" target="_blank">Live Board ↗</a>
          <button class="btn-small" onclick="setGolemioKey()">API Key</button>
        </span>
      </h2>
      <div id="trains">Loading departures...</div>
    </div>

    <!-- Column 2: Weather & Obec Zeleneč -->
    <div class="card">
      <h2>
        <span>🌤️ Weather Forecast</span>
        <a class="btn-small" href="https://yr.no" target="_blank">10-Day (Yr.no) ↗</a>
      </h2>


      <h2>
        <span>🏘️ Obec Zeleneč</span>
        <a class="btn-small" href="https://facebook.com" target="_blank">Facebook ↗</a>
      </h2>
      <div id="village">Loading village news...</div>
    </div>

    <!-- Column 3: Czech News -->
    <div class="card">
      <h2>🇨🇿 Czech News (EN)</h2>
      <div id="news">Loading Czech news...</div>
    </div>
  </div>

  <script>
    const OPEN_METEO = ["https:/", "://open-meteo.com", "v1", "forecast"].join("/");
    const GOLEMIO_URL = ["https:/", "api.golemio.cz", "v2", "pid", "departureboards"].join("/");

    // 1. Live Weather (Zeleneč & Prague)
    const weatherIcons = {
      0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️",
      45: "🌫️", 48: "🌫️", 51: "🌦️", 61: "🌧️",
      71: "❄️", 80: "🌦️", 95: "⛈️"
    };

    async function getWeather(city, lat, lon) {
      const host = "api." + "open-meteo" + ".com";
      const url = "https://" + host + "/v1/forecast?latitude=" + lat + "&longitude=" + lon +
        "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
        "&daily=weather_code,temperature_2m_max,temperature_2m_min" +
        "&timezone=Europe%2FPrague&forecast_days=5";

      const res = await fetch(url);
      const d = await res.json();
      const c = d.current;
      const daily = d.daily;

      let forecastRows = "";
      for (let i = 0; i < daily.time.length; i++) {
        const dateObj = new Date(daily.time.at(i) + "T12:00:00");
        const dayName = i === 0 ? "Today" : dateObj.toLocaleDateString("en-GB", { weekday: "short" });
        const icon = weatherIcons[daily.weather_code.at(i)] || "🌡️";
        const hi = Math.round(daily.temperature_2m_max.at(i));
        const lo = Math.round(daily.temperature_2m_min.at(i));
        forecastRows += `
          <div style="display:flex; justify-content:space-between; font-size:0.8rem; padding:3px 0; border-top:1px solid rgba(255,255,255,0.06);">
            <span style="color:var(--muted); width:44px;">${dayName}</span>
            <span>${icon}</span>
            <span><strong>${hi}°</strong> <span style="color:var(--muted)">/ ${lo}°</span></span>
          </div>`;
      }

      return `
        <div class="weather-box">
          <div class="weather-city">${city}</div>
          <div class="weather-temp">${Math.round(c.temperature_2m)}°C</div>
          <div class="weather-sub" style="margin-bottom:0.65rem;">
            ${weatherIcons[c.weather_code] || "🌡️"} Feels ${Math.round(c.apparent_temperature)}° • ${Math.round(c.wind_speed_10m)} km/h
          </div>
          ${forecastRows}
        </div>`;
    }

    Promise.all([
      getWeather("Zeleneč", 50.130, 14.666),
      getWeather("Prague", 50.075, 14.437)
    ]).then(([zel, prg]) => {
      document.getElementById("weather").innerHTML = zel + prg;
    }).catch(err => {
      document.getElementById("weather").innerHTML = `<div class="weather-box">Weather error: ${err.message}</div>`;
    });

    // 2. Live Zeleneč Trains via Golemio (stored locally in Vivaldi)
    function setGolemioKey() {
      const k = prompt("Paste your Golemio API Key (saved only in Vivaldi):");
      if (k && k.trim()) {
        localStorage.setItem("golemio_key", k.trim());
        loadTrains();
      }
    }

    function loadTrains() {
      const key = localStorage.getItem("golemio_key");
      if (!key) {
        document.getElementById("trains").innerHTML = `<p style="color:var(--muted)">Click <strong>API Key</strong> above to connect live Golemio train times.</p>`;
        return;
      }
      const u = new URL(GOLEMIO_URL);
      u.searchParams.set("names", "Zeleneč");
      u.searchParams.set("minutesAfter", "120");
      u.searchParams.set("limit", "8");

      fetch(u.toString(), {
        headers: { "X-Access-Token": key }
      })
        .then(r => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(d => {
          const deps = d.departures || [];
          document.getElementById("trains").innerHTML = deps.map(t => {
            const line = t.route?.short_name || "Train";
            const dest = t.trip?.headsign || "";
            const time = (t.departure_timestamp?.predicted || "").slice(11, 16);
            const delay = t.delay?.minutes || 0;
            return `
              <div class="train-row">
                <div class="train-time">${time}</div>
                <div class="train-info">
                  <div class="train-dest">${dest}</div>
                  <div class="train-num">Line ${line}</div>
                </div>
                <div class="${delay > 0 ? 'badge-delay' : 'badge-ok'}">${delay > 0 ? '+' + delay + ' min' : 'On time'}</div>
              </div>`;
          }).join("") || "<p style='color:var(--muted)'>No trains in next 2 hours.</p>";
        })
        .catch(err => {
          document.getElementById("trains").innerHTML = `<p style="color:var(--muted)">Train feed error (${err.message}). Check API key or click Live Board ↗ above.</p>`;
        });
    }
    loadTrains();

    // 3. Load Village & Czech News from GitHub Action data.json
    const dataUrl = new URL("./data.json", window.location.href);
    dataUrl.searchParams.set("t", Date.now());
    fetch(dataUrl.toString())
      .then(r => r.json())
      .then(d => {
        document.getElementById("village").innerHTML = (d.village || []).map(v => `
          <div class="news-item">
            <div class="news-meta">${v.date || "Obec Zeleneč"}</div>
            <a href="${v.link}" target="_blank">${v.title}</a>
            ${v.cz && v.cz !== v.title ? `<div style="font-size:0.8rem; color:var(--muted); margin-top:0.2rem;">${v.cz}</div>` : ""}
          </div>
        `).join("") || "<p style='color:var(--muted)'>No village news found.</p>";
        
        document.getElementById("news").innerHTML = (d.news || []).map(n => `
          <div class="news-item">
            <div class="news-meta">${n.meta || "Czech News"}</div>
            <a href="${n.link}" target="_blank">${n.title}</a>
          </div>
        `).join("") || "<p style='color:var(--muted)'>No Czech news found.</p>";
      });
  </script>
</body>
</html>
