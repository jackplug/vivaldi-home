<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeleneč Home</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="top-bar">
    <div>
      <span class="clock" id="clock"></span>
      <span class="clock-date" id="clock-date"></span>
    </div>
    <button class="btn-small" onclick="applyWallpaper(true)">🔄 Next Photo</button>
    <button class="btn-small" onclick="changeWallpaper()">🖼️ Wallpaper</button>
  </div>

  <div class="grid">
    <!-- Card 1: Trains -->
    <div class="card">
      <h2>
        <span><span>🚆</span><span>Zeleneč Departures</span></span>
        <span>
          <a class="btn-small" href="https://spravazeleznic.cz" target="_blank">Live Board ↗</a>
          <button class="btn-small" onclick="setGolemioKey()">API Key</button>
        </span>
      </h2>
      <div id="trains">Loading departures...</div>
    </div>

    <!-- Card 2: Weather Only -->
    <div class="card">
      <h2>
        <span><span>🌤️</span><span>Weather Forecast</span></span>
        <span>
          <a class="btn-small" href="https://yr.no" target="_blank">10-Day (Yr.no) ↗</a>
        </span>
      </h2>
      <div class="weather-grid" id="weather">
        <div class="weather-box">Loading Zeleneč...</div>
        <div class="weather-box">Loading Prague...</div>
      </div>
    </div>

    <!-- Card 3: Czech News -->
    <div class="card">
      <h2>
        <span><span>🇨🇿</span><span>Czech News (EN)</span></span>
      </h2>
      <div id="news">Loading Czech news...</div>
    </div>

    <!-- Card 4: Wide Obec Zeleneč Card (Spans 2 Columns) -->
    <div class="card span-2">
      <h2>
        <span><span>🏘️</span><span>Obec Zeleneč</span></span>
        <span>
          <a class="btn-small" href="https://facebook.com" target="_blank">Facebook ↗</a>
        </span>
      </h2>
      <div class="village-split">
        <div>
          <div class="sub-header">Official Website</div>
          <div id="village-web">Loading website news...</div>
        </div>
        <div class="village-col-right">
          <div class="sub-header">Facebook Updates</div>
          <div id="village-fb">Loading Facebook posts...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
