<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeleneč Home</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --border: #262a36;
      --text: #e6e8ef;
      --muted: #8b92a5;
      --accent: #7aa2f7;
      --green: #9ece6a;
      --red: #f7768e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
    }
    .grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.4rem;
    }
    h2 {
      margin: 0 0 1rem 0;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.65rem;
    }
    /* Weather Styling */
    .weather-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .weather-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem;
    }
    .weather-city { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
    .weather-temp { font-size: 1.65rem; font-weight: 700; }
    .weather-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }

    /* Train Rows */
    .train-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
    }
    .train-row:last-child { border-bottom: none; }
    .train-time { font-weight: 700; font-size: 1.05rem; color: #fff; min-width: 52px; }
    .train-info { flex: 1; padding: 0 0.75rem; }
    .train-dest { font-weight: 500; font-size: 0.95rem; }
    .train-num { font-size: 0.78rem; color: var(--muted); }
    .badge-ok { color: var(--green); font-size: 0.8rem; font-weight: 600; }
    .badge-delay { color: var(--red); font-size: 0.8rem; font-weight: 700; }

    /* News & Village Items */
    .news-item {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }
    .news-item:last-child { border-bottom: none; }
    .news-item a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      line-height: 1.35;
      display: block;
    }
    .news-item a:hover { color: var(--accent); }
    .news-meta { font-size: 0.75rem; color: var(--accent); margin-bottom: 0.25rem; }
    .news-summary { font-size: 0.83rem; color: var(--muted); margin-top: 0.3rem; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="grid">
    <!-- Column 1: Trains -->
    <div class="card">
      <h2>🚆 Zeleneč Departures</h2>
      <div id="trains">Loading departures...</div>
    </div>

    <!-- Column 2: Weather & Obec Zeleneč -->
    <div class="card">
      <h2>🌤️ Weather Forecast</h2>
      <div class="weather-grid" id="weather">
        <div class="weather-box">Loading Zeleneč...</div>
        <div class="weather-box">Loading Prague...</div>
      </div>

      <h2>🏘️ Obec Zeleneč</h2>
      <div id="village">Loading village news...</div>
    </div>

    <!-- Column 3: Czech News -->
    <div class="card">
      <h2>🇨🇿 Czech News (EN)</h2>
      <div id="news">Loading Czech news...</div>
    </div>
  </div>

  <script>
    const weatherIcons = {
      0: "☀️ Clear", 1: "🌤️ Mostly clear", 2: "⛅ Partly cloudy", 3: "☁️ Overcast",
      45: "🌫️ Fog", 48: "🌫️ Rime fog", 51: "🌦️ Drizzle", 61: "🌧️ Rain",
      71: "❄️ Snow", 80: "🌦️ Showers", 95: "⛈️ Storm"
    };

    function renderWeather(zel, prg) {
      if (!zel || !prg) return;
      document.getElementById("weather").innerHTML = `
        <div class="weather-box">
          <div class="weather-city">Zeleneč</div>
          <div class="weather-temp">${zel.temp}°C</div>
          <div class="weather-sub">${weatherIcons[zel.code] || "🌡️"} • H:${zel.max}° L:${zel.min}°</div>
        </div>
        <div class="weather-box">
          <div class="weather-city">Prague</div>
          <div class="weather-temp">${prg.temp}°C</div>
          <div class="weather-sub">${weatherIcons[prg.code] || "🌡️"} • H:${prg.max}° L:${prg.min}°</div>
        </div>`;
    }

    // Load data.json (Trains, Village News, Czech News + Backup Weather)
    fetch("./data.json?t=" + Date.now())
      .then(r => r.json())
      .then(d => {
        if (d.weather && d.weather.zelenec && d.weather.prague) {
          renderWeather(d.weather.zelenec, d.weather.prague);
        }

        document.getElementById("trains").innerHTML = (d.trains || []).map(t => `
          <div class="train-row">
            <div class="train-time">${t.time}</div>
            <div class="train-info">
              <div class="train-dest">${t.dest}</div>
              <div class="train-num">${t.train}</div>
            </div>
            <div class="${t.delay > 0 ? 'badge-delay' : 'badge-ok'}">${t.delay > 0 ? '+' + t.delay + ' min' : 'On time'}</div>
          </div>
        `).join("") || "<p style='color:var(--muted)'>No departures listed right now.</p>";

        document.getElementById("village").innerHTML = (d.village || []).map(v => `
          <div class="news-item">
            <div class="news-meta">${v.date || "Obec Zeleneč"}</div>
            <a href="${v.link}" target="_blank">${v.title}</a>
          </div>
        `).join("") || "<p style='color:var(--muted)'>No village news found.</p>";

        document.getElementById("news").innerHTML = (d.news || []).map(n => `
          <div class="news-item">
            <div class="news-meta">${n.meta || "Czech News"}</div>
            <a href="${n.link}" target="_blank">${n.title}</a>
            ${n.summary ? `<div class="news-summary">${n.summary}</div>` : ""}
          </div>
        `).join("") || "<p style='color:var(--muted)'>No Czech news found.</p>";
      });

    // Also refresh Weather live in browser
    Promise.all([
      fetch("https://open-meteo.com").then(r => r.json()),
      fetch("https://open-meteo.com").then(r => r.json())
    ]).then(([z, p]) => {
      renderWeather(
        { temp: Math.round(z.current.temperature_2m), code: z.current.weather_code, max: Math.round(z.daily.temperature_2m_max), min: Math.round(z.daily.temperature_2m_min) },
        { temp: Math.round(p.current.temperature_2m), code: p.current.weather_code, max: Math.round(p.daily.temperature_2m_max), min: Math.round(p.daily.temperature_2m_min) }
      );
    }).catch(() => {});
</script>

</body>
</html>
