name: Update Dashboard Data
on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes
  workflow_dispatch:        # Lets you click a button to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 feedparser
      - env:
          GOLEMIO_KEY: ${{ secrets.GOLEMIO_API_KEY }}
        run: python fetch.py
      - run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@://github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update data"
          git push
